name: EZStats
version: '${project.version}'
main: com.ezstats.EZStatsPlugin
api-version: '1.21'
description: A web dashboard for EZvac thermostats.
depend: [EZvac]
commands:
  ezstats:
    description: Register a website account, claim thermostats, and sign in to the EZStats website.
    usage: /ezstats <register|password|own|nick|disown|quicklogin|resetpassword|unlink|status|reload>
    aliases: [ezs]
    permission: ezstats.use
permissions:
  ezstats.use:
    description: Allows /ezstats register, own, quicklogin and the rest of the player commands.
    default: true
  ezstats.admin:
    description: Allows /ezstats reload, and /ezstats disown on thermostats owned by others.
    default: op
