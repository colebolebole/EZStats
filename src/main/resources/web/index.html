<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZStats</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <h1>EZStats</h1>
    <div class="who">
      <span id="who"></span>
      <button id="logout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <section id="unlinked" class="panel" hidden>
      <h2>Sign in</h2>
      <form id="login" autocomplete="on">
        <label for="username">Minecraft name</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="32" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit" type="submit" class="primary">Sign in</button>
      </form>
      <p class="hint">No password yet? In game, run <code>/ezstats register &lt;password&gt;</code>.
        Or run <code>/ezstats link</code> and open the one-time link it gives you.</p>
    </section>

    <section id="linked" hidden>
      <div id="notice" class="notice" hidden></div>
      <div id="worlds" class="worlds"></div>
      <div id="empty" class="panel" hidden>
        <h2>No thermostats yet</h2>
        <p>Look at a thermostat's sign in game and run <code>/ezstats own</code> to add it to your account.</p>
      </div>
      <div id="grid" class="grid"></div>
      <p id="foot" class="foot"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
