# EZStats: a web dashboard for EZvac thermostats.

web:
  # The address the dashboard listens on. 0.0.0.0 is every network interface;
  # use 127.0.0.1 to listen only to this machine (for example behind a reverse proxy).
  bind: 0.0.0.0
  port: 8765
  # The address players open, as they reach it from outside: it is what
  # /ezstats link puts in the link, with no trailing slash. For example
  # https://stats.example.com (behind a proxy) or http://play.example.com:8765.
  # Left empty, EZStats guesses http://<server-ip>:<port>, which only works if
  # server.properties has your server's address in server-ip.
  public-url: ""
  # Turn on only behind a reverse proxy that adds X-Forwarded-For. It makes the
  # login limiter tell visitors apart by their real address instead of the
  # proxy's; with no proxy, a visitor could fake it to dodge the limiter.
  trust-forwarded-for: false

link:
  # How long a /ezstats link link works, and it works once.
  token-ttl-seconds: 300

session:
  # How long a linked browser stays signed in. Sessions are kept in memory:
  # a server restart signs everyone out, and /ezstats link signs them back in.
  ttl-hours: 72

# How often the dashboard's numbers are read from EZvac, in ticks (20 = every second).
refresh-ticks: 20

# How often each thermostat's nearest weather station is read, in ticks (200 = every 10 seconds).
# Weather changes slowly, so this can be much slower than refresh-ticks.
weather-refresh-ticks: 200

control:
  # Lets players change their own thermostats from the website: the target, on and off, and the
  # profile. It uses EZvac's control API (EZvac BETA 1.0 Pilot 7 or newer) and acts for the signed-in
  # player, so EZvac's /hvac info shows who changed it and a claims plugin can still refuse it.
  # Only the owner of a thermostat (/ezstats own) can change it. Set false to make the website
  # read-only. Needs a server restart to take effect.
  enabled: true

weather-tab:
  # The Weather tab shows every weather station and its forecast to any player who is signed in,
  # with each station's coordinates. Set false to leave it off.
  enabled: true
